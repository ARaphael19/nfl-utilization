name: Update NFL Data

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get our repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest NFL player data
        run: |
          mkdir -p data
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/players/players.csv" \
            -o data/players.csv

      - name: Download 2026 weekly roster data
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv" \
            -o data/roster_weekly_2026.csv

      - name: Download weekly player stats
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv" \
            -o data/player_stats.csv

      - name: Download 2026 snap counts
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_2026.csv" \
            -o data/snap_counts.csv

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Inspect parsed 2026 play-by-play
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2026.rds" \
            -o /tmp/pbp_2026.rds

          Rscript -e '
          x <- readRDS("/tmp/pbp_2026.rds")

          cat("========================================\n")
          cat("PARSED 2026 PBP TEST\n")
          cat("========================================\n\n")

          cat("OBJECT TYPE:\n")
          print(class(x))

          cat("\nNUMBER OF PLAYS:\n")
          print(nrow(x))

          cat("\nNUMBER OF COLUMNS:\n")
          print(ncol(x))

          cat("\nPLAYER/DROPBACK RELATED COLUMNS:\n")

          possible <- names(x)[grepl(
            "player|offense|defense|participant|route|dropback|passer|receiver|posteam",
            names(x),
            ignore.case = TRUE
          )]

          print(possible)

          cat("\nQB DROPBACK:\n")

          if ("qb_dropback" %in% names(x)) {
            print(table(x$qb_dropback, useNA = "ifany"))
          } else {
            cat("qb_dropback was NOT found.\n")
          }

          cat("\nFIRST FEW DROPBACK PLAYS:\n")

          if ("qb_dropback" %in% names(x)) {
            dropbacks <- x[x$qb_dropback == 1, ]

            print(
              dropbacks[
                1:min(5, nrow(dropbacks)),
                possible,
                drop = FALSE
              ]
            )
          }

          cat("\n========================================\n")
          cat("END PARSED PBP TEST\n")
          cat("========================================\n")
          '

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.csv data/roster_weekly_2026.csv data/player_stats.csv data/snap_counts.csv
          git diff --cached --quiet || git commit -m "Update NFL data"
          git push origin HEAD:${{ github.ref_name }}
