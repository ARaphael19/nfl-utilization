name: Update NFL Data

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get our repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest NFL player data
        run: |
          mkdir -p data
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/players/players.csv" \
            -o data/players.csv

      - name: Download 2026 weekly roster data
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv" \
            -o data/roster_weekly_2026.csv

      - name: Download weekly player stats
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv" \
            -o data/player_stats.csv

      - name: Download 2026 snap counts
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_2026.csv" \
            -o data/snap_counts.csv

      - name: Inspect raw 2026 play-by-play
        run: |
          curl -L "https://github.com/nflverse/nflverse-pbp/releases/download/raw_pbp_2026/2026_01_SF_LA.rds" \
            -o /tmp/test_game.rds

          Rscript -e '
          x <- readRDS("/tmp/test_game.rds")

          cat("========================================\n")
          cat("RAW PBP TEST\n")
          cat("========================================\n\n")

          cat("OBJECT TYPE:\n")
          print(class(x))

          cat("\nCOLUMN NAMES:\n")
          print(names(x))

          cat("\nNUMBER OF PLAYS:\n")
          print(nrow(x))

          cat("\nLOOKING FOR PLAYER/PARTICIPATION FIELDS:\n")
          possible <- names(x)[grepl(
            "player|offense|defense|participant|route|dropback",
            names(x),
            ignore.case = TRUE
          )]

          print(possible)

          cat("\nQB DROPBACK FIELD:\n")
          if ("qb_dropback" %in% names(x)) {
            print(table(x$qb_dropback, useNA = "ifany"))
          } else {
            cat("qb_dropback was NOT found.\n")
          }

          cat("\nPOSSIBLE PARTICIPATION DATA:\n")
          for (field in possible) {
            cat("\n--- ", field, " ---\n", sep = "")
            print(head(x[[field]], 3))
          }

          cat("\n========================================\n")
          cat("END RAW PBP TEST\n")
          cat("========================================\n")
          '

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.csv data/roster_weekly_2026.csv data/player_stats.csv data/snap_counts.csv
          git diff --cached --quiet || git commit -m "Update NFL data"
          git push origin HEAD:${{ github.ref_name }}
