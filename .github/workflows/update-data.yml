name: Update NFL Data

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get our repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest NFL player data
        run: |
          mkdir -p data
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/players/players.csv" \
            -o data/players.csv

      - name: Download 2026 weekly roster data
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv" \
            -o data/roster_weekly_2026.csv

      - name: Download weekly player stats
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv" \
            -o data/player_stats.csv

      - name: Download 2026 snap counts
        run: |
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_2026.csv" \
            -o data/snap_counts.csv

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Test 2026 participation data
        run: |
          echo "Testing 2026 participation data..."

          HTTP_CODE=$(curl -L -s -o /tmp/participation_2026.rds \
            -w "%{http_code}" \
            "https://github.com/nflverse/nflverse-data/releases/download/pbp_participation/pbp_participation_2026.rds")

          echo "HTTP STATUS: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "2026 participation file is not currently available."
            exit 0
          fi

          Rscript -e '
          x <- readRDS("/tmp/participation_2026.rds")

          cat("========================================\n")
          cat("2026 PARTICIPATION TEST\n")
          cat("========================================\n\n")

          cat("OBJECT TYPE:\n")
          print(class(x))

          cat("\nNUMBER OF PLAYS:\n")
          print(nrow(x))

          cat("\nNUMBER OF COLUMNS:\n")
          print(ncol(x))

          cat("\nCOLUMNS:\n")
          print(names(x))

          cat("\nIMPORTANT PARTICIPATION COLUMNS:\n")

          possible <- names(x)[grepl(
            "offense_players|offense_names|offense_positions|players_on_play|route|n_offense",
            names(x),
            ignore.case = TRUE
          )]

          print(possible)

          cat("\n========================================\n")
          cat("END PARTICIPATION TEST\n")
          cat("========================================\n")
          '

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.csv data/roster_weekly_2026.csv data/player_stats.csv data/snap_counts.csv
          git diff --cached --quiet || git commit -m "Update NFL data"
          git push origin HEAD:${{ github.ref_name }}
