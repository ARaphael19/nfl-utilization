name: Update NFL Data

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get our repository
        uses: actions/checkout@v4

      - name: Download latest NFL player data
        run: |
          mkdir -p data
          curl -L "https://github.com/nflverse/nflverse-data/releases/download/players/players.csv" \
            -o data/players.csv

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.csv
          git diff --cached --quiet || git commit -m "Update NFL player data"
          git push
