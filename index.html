<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Utilization</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px;
    }

    header h1 {
      margin: 0 0 8px 0;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .controls {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    select {
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #bbb;
      background: white;
    }

    #status {
      margin-top: 12px;
      color: #555;
    }

    .teams {
      padding: 20px;
    }

    .team {
      background: white;
      margin-bottom: 24px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .team-header {
      background: #e5e7eb;
      padding: 14px 18px;
      font-size: 20px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f9fafb;
      font-size: 13px;
      text-transform: uppercase;
      color: #555;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .empty {
      padding: 16px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>NFL Utilization</h1>
    <p>Player usage and fantasy analysis</p>
  </header>

  <div class="controls">
    <label for="position"><strong>Position:</strong></label>

    <select id="position">
      <option value="RB">Running Backs</option>
      <option value="WR">Wide Receivers</option>
      <option value="TE">Tight Ends</option>
    </select>

    <select id="week" onchange="updateWeek()">
      <option value="season">Season</option>
      <option value="1">Week 1</option>
      <option value="2">Week 2</option>
      <option value="3">Week 3</option>
      <option value="4">Week 4</option>
    </select>

    <div id="status">Loading NFL data...</div>
  </div>

  <div id="teams" class="teams"></div>

  <script>
    const teams = [
      "ARI", "ATL", "BAL", "BUF", "CAR", "CHI", "CIN", "CLE",
      "DAL", "DEN", "DET", "GB", "HOU", "IND", "JAX", "KC",
      "LV", "LAC", "LAR", "MIA", "MIN", "NE", "NO", "NYG",
      "NYJ", "PHI", "PIT", "SF", "SEA", "TB", "TEN", "WAS"
    ];

    let rosterData = [];
    let snapData = [];

    let selectedWeek = "season";

    function updateWeek() {
      selectedWeek = document.getElementById("week").value;
      displayTeams();
    }

    async function loadData() {
      try {
        const response = await fetch("data/roster_weekly_2026.csv");

        if (!response.ok) {
          throw new Error("Could not load roster data.");
        }

        const csvText = await response.text();

rosterData = parseCSV(csvText);

console.log("First roster row:", rosterData[0]);
console.log("First roster week:", rosterData[0].week);
console.log("Roster columns:", Object.keys(rosterData[0]));

const snapResponse = await fetch("data/snap_counts.csv");

if (!snapResponse.ok) {
  throw new Error("Could not load snap counts.");
}

const snapText = await snapResponse.text();

snapData = parseCSV(snapText);

console.log("First snap row:", snapData[0]);
console.log("Snap columns:", Object.keys(snapData[0]));
console.log("First snap PFR ID:", snapData[0].pfr_player_id);
console.log("First roster PFR ID:", rosterData[0].pfr_id);

const testPlayer = rosterData.find(player =>
  player.pfr_id &&
  snapData.some(snap =>
    snap.pfr_player_id === player.pfr_id &&
    snap.team === player.team &&
    Number(snap.week) === Number(player.week)
  )
);

console.log("Matching player test:", testPlayer);        

document.getElementById("status").textContent =
  `Loaded ${rosterData.length.toLocaleString()} roster records and ${snapData.length.toLocaleString()} snap records.`;

displayTeams();

      } catch (error) {
        console.error(error);

        document.getElementById("status").textContent =
          "There was a problem loading the NFL data.";
      }
    }

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);

  function parseLine(line) {
    const values = [];
    let current = "";
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];

      if (char === '"') {
        if (insideQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }
      } else if (char === "," && !insideQuotes) {
        values.push(current);
        current = "";
      } else {
        current += char;
      }
    }

    values.push(current);

    return values;
  }

  const headers = parseLine(lines[0]);

  return lines.slice(1).map(line => {
    const values = parseLine(line);

    const row = {};

    headers.forEach((header, index) => {
      row[header] = values[index] || "";
    });

    return row;
  });
}

    function displayTeams() {
      const selectedPosition =
        document.getElementById("position").value;
      
      console.log("Selected week:", selectedWeek);
      console.log("Example weeks:", rosterData.slice(0, 20).map(p => p.week).join(", "));
      
      const container =
        document.getElementById("teams");

      container.innerHTML = "";

      teams.forEach(team => {

       let players = rosterData.filter(player =>
  player.team === team &&
  player.position === selectedPosition &&
  (
    selectedWeek === "season" ||
    Number(player.week) === Number(selectedWeek)
  )
);

if (selectedWeek === "season") {
  const uniquePlayers = {};

  players.forEach(player => {
    const id = player.gsis_id || player.full_name;

    uniquePlayers[id] = player;
  });

  players = Object.values(uniquePlayers);
}

        const teamDiv = document.createElement("div");
        teamDiv.className = "team";

        const header = document.createElement("div");
        header.className = "team-header";
        header.textContent = team;

        teamDiv.appendChild(header);

        if (players.length === 0) {

          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No players found.";

          teamDiv.appendChild(empty);

        } else {

          const table = document.createElement("table");

          table.innerHTML = `
            <thead>
              <tr>
                <th>Player Name</th>
                <th>Position</th>
                <th>Week</th>
                <th>Snap %</th>
              </tr>
            </thead>
            <tbody>
              ${players.map(player => `
                <tr>
                  <td>${player.full_name}</td>
                  <td>${player.position}</td>
                  <td>${selectedWeek === "season" ? "Season" : player.week}</td>
                  <td>${
  selectedWeek === "season"
    ? "-"
    : (
        snapData.find(snap =>
          snap.pfr_player_id === player.pfr_id &&
          snap.team === player.team &&
          Number(snap.week) === Number(player.week)
        )?.offense_pct
  ? `${(Number(
      snapData.find(snap =>
        snap.pfr_player_id === player.pfr_id &&
        snap.team === player.team &&
        Number(snap.week) === Number(player.week)
      ).offense_pct) * 100).toFixed(0)}%`
  : "-"
      )
}</td>
                </tr>
              `).join("")}
            </tbody>
          `;

          teamDiv.appendChild(table);
        }

        container.appendChild(teamDiv);
      });
    }

    document
      .getElementById("position")
      .addEventListener("change", displayTeams);

    loadData();
  </script>

</body>
</html>
