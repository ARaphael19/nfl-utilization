<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFL Utilization</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            margin: 0;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
        }

        header p {
            margin: 0;
            color: #cbd5e1;
        }

        .controls {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        select {
            font-size: 16px;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
        }

        #status {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 0 20px;
            color: #555;
        }

        .team {
            max-width: 1200px;
            margin: 25px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .team-header {
            background: #e5e7eb;
            padding: 14px 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        tr:hover {
            background: #f8fafc;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>

<body>

<header>
    <h1>NFL Utilization</h1>
    <p>Weekly player usage and opportunity</p>
</header>

<div class="controls">
    <label for="position"><strong>Position:</strong></label>

    <select id="position">
        <option value="RB">Running Backs</option>
        <option value="WR">Wide Receivers</option>
        <option value="TE">Tight Ends</option>
    </select>
</div>

<div id="status">
    Loading NFL player data...
</div>

<div id="teams"></div>

<script>

const DATA_URL = "data/players.csv";

const teamNames = {
    ARI: "Arizona Cardinals",
    ATL: "Atlanta Falcons",
    BAL: "Baltimore Ravens",
    BUF: "Buffalo Bills",
    CAR: "Carolina Panthers",
    CHI: "Chicago Bears",
    CIN: "Cincinnati Bengals",
    CLE: "Cleveland Browns",
    DAL: "Dallas Cowboys",
    DEN: "Denver Broncos",
    DET: "Detroit Lions",
    GB: "Green Bay Packers",
    HOU: "Houston Texans",
    IND: "Indianapolis Colts",
    JAX: "Jacksonville Jaguars",
    KC: "Kansas City Chiefs",
    LV: "Las Vegas Raiders",
    LAC: "Los Angeles Chargers",
    LAR: "Los Angeles Rams",
    MIA: "Miami Dolphins",
    MIN: "Minnesota Vikings",
    NE: "New England Patriots",
    NO: "New Orleans Saints",
    NYG: "New York Giants",
    NYJ: "New York Jets",
    PHI: "Philadelphia Eagles",
    PIT: "Pittsburgh Steelers",
    SF: "San Francisco 49ers",
    SEA: "Seattle Seahawks",
    TB: "Tampa Bay Buccaneers",
    TEN: "Tennessee Titans",
    WAS: "Washington Commanders"
};

let players = [];

async function loadPlayers() {

    try {

        const response = await fetch(DATA_URL);

        if (!response.ok) {
            throw new Error("Could not load players.csv");
        }

        const text = await response.text();

        const rows = parseCSV(text);

        players = rows.filter(player =>
            ["RB", "WR", "TE"].includes(player.position)
        );

        document.getElementById("status").textContent =
            `Loaded ${players.length} NFL players.`;

        renderTeams();

    } catch (error) {

        document.getElementById("status").innerHTML =
            `<span class="error">
                Could not load NFL data. ${error.message}
            </span>`;

        console.error(error);
    }
}


function parseCSV(text) {

    const lines = text.trim().split(/\r?\n/);

    const headers = lines[0]
        .split(",")
        .map(header => header.trim());

    return lines.slice(1).map(line => {

        const values = line.split(",");

        const player = {};

        headers.forEach((header, index) => {
            player[header] = values[index]?.trim() || "";
        });

        return player;
    });
}


function renderTeams() {

    const selectedPosition =
        document.getElementById("position").value;

    const container =
        document.getElementById("teams");

    container.innerHTML = "";

    const filteredPlayers =
        players.filter(player =>
            player.position === selectedPosition
        );

    const playersByTeam = {};

    filteredPlayers.forEach(player => {

        const team = player.team_abbr || "FA";

        if (!playersByTeam[team]) {
            playersByTeam[team] = [];
        }

        playersByTeam[team].push(player);
    });

    Object.keys(teamNames)
        .sort((a, b) =>
            teamNames[a].localeCompare(teamNames[b])
        )
        .forEach(team => {

            const teamPlayers =
                playersByTeam[team] || [];

            const teamDiv =
                document.createElement("div");

            teamDiv.className = "team";

            teamDiv.innerHTML = `
                <div class="team-header">
                    ${teamNames[team]}
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>Position</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody>

                            ${
                                teamPlayers.length
                                ?
                                teamPlayers.map(player => `
                                    <tr>
                                        <td>
                                            ${player.display_name || player.full_name || "Unknown"}
                                        </td>

                                        <td>
                                            ${player.position}
                                        </td>

                                        <td>
                                            ${player.status || ""}
                                        </td>
                                    </tr>
                                `).join("")
                                :
                                `
                                    <tr>
                                        <td colspan="3">
                                            No players found
                                        </td>
                                    </tr>
                                `
                            }

                        </tbody>

                    </table>

                </div>
            `;

            container.appendChild(teamDiv);
        });
}


document
    .getElementById("position")
    .addEventListener("change", renderTeams);


loadPlayers();

</script>

</body>
</html>
